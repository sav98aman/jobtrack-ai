<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../ui.css"></head>
<body class="popup"><h1>JobTrack AI</h1>
<button id="openDashboard" style="background:#2563EB;color:#fff;border:none;font-weight:600;width:100%;padding:8px 12px;border-radius:6px;cursor:pointer;margin:6px 0 8px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;">📊 View All Applications</button>
<section id="page" class="muted">Checking this page…</section>
<section id="manualBox" style="display:none;margin:8px 0;padding:8px;border:1px solid var(--line);border-radius:6px;background:rgba(255,255,255,0.04);">
  <b style="font-size:12px;">Log application manually:</b>
  <label style="margin-top:4px;">Company<input id="manCo" placeholder="e.g. Google"></label>
  <label style="margin-top:4px;">Job title<input id="manTitle" placeholder="e.g. Full Stack Engineer"></label>
  <div class="row" style="margin-top:6px;"><button id="saveManual">Save to Sheet</button><button id="cancelManual">Cancel</button></div>
</section>
<section id="reviews"></section>
<section class="row"><button id="connect">Connect Google</button><button id="sync">Sync now</button><button id="testRow">Test sheet</button><button id="addManual">+ Log Job</button><button id="pause"></button></section>
<section id="status" class="muted"></section>
<section id="history" style="font-size:12px;margin:8px 0;max-height:90px;overflow-y:auto;border-top:1px solid var(--line);padding-top:6px;"></section>
<a href="#" id="opts">Settings</a> <a href="#" id="openSheet" style="margin-left:12px;">Open Google Sheet ↗</a><script src="popup.js"></script></body></html>
