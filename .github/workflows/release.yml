name: Build and Release Extension

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Package Extension ZIP
        run: |
          mkdir -p dist
          zip -r "dist/jobtrack-ai-${{ github.ref_name }}.zip" manifest.json icon.png icons/ src/ scripts/ LICENSE PRIVACY_POLICY.md README.md -x "*.DS_Store" "src/config.local.js" "manifest.local.json"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
